# CampusFlow Server Configuration
# ADR-005: server.properties — configurable without recompilation (NFR-09)
#
# Changes take effect only after a server restart.

# TCP port the server listens on
server.port=9090

# Size of the fixed thread pool handling client connections
server.thread.pool.size=20

# Session inactivity timeout in minutes (ADR-003)
server.session.timeout.minutes=30

# SQLite database file path (relative to server working directory)
server.db.path=campusflow.db
